name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure repositories for CI
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          // CI 环境：官方仓库优先，阿里云镜像兜底
          // 避免 GitHub runner（美国）访问阿里云不稳定导致插件解析失败
          // 注意：项目设了 FAIL_ON_PROJECT_REPOS，所以只改 settings 级仓库，不碰 project 级
          beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                      maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                      maven { url 'https://maven.aliyun.com/repository/public' }
                  }
              }
              settings.dependencyResolutionManagement {
                  repositories {
                      google()
                      mavenCentral()
                      maven { url 'https://maven.aliyun.com/repository/public' }
                      maven { url 'https://maven.aliyun.com/repository/google' }
                      maven { url 'https://jitpack.io' }
                  }
              }
          }
          EOF

      - name: Show toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: List artifacts
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: roubao-debug-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
